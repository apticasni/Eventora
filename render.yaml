services:
  - type: web
    name: eventora-api
    runtime: node
    rootDir: .
    buildCommand: npm ci && npm run build --workspace=@eventora/shared && npm run build --workspace=@eventora/api
    startCommand: npm run start --workspace=@eventora/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
