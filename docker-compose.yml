name: eventora-local

services:
  postgres:
    image: postgres:18
    container_name: eventora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${EVENTORA_DB_NAME:?Set EVENTORA_DB_NAME in .env.docker}"
      POSTGRES_USER: "${EVENTORA_DB_USER:?Set EVENTORA_DB_USER in .env.docker}"
      POSTGRES_PASSWORD: "${EVENTORA_DB_PASSWORD:?Set EVENTORA_DB_PASSWORD in .env.docker}"
    ports:
      - "127.0.0.1:${EVENTORA_DB_HOST_PORT:-5433}:5432"
    volumes:
      - eventora_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: eventora-api
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    environment:
      NODE_ENV: development
      PORT: "4000"
      FRONTEND_URL: http://localhost:3000
      DATABASE_URL: "${EVENTORA_DOCKER_DATABASE_URL:?Set local URL in .env.docker}"
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: eventora-web
    restart: unless-stopped
    env_file:
      - ./apps/web/.env.local
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/events').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 40s

volumes:
  eventora_postgres_data:
